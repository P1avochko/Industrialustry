block.industrialustry-underground-turbine.description = При установке на жерло вырабатывает энергию.
block.industrialustry-powernode.name = Энергетический узел
block.industrialustry-powernode.description = Передает лучи энергии на относительно короткие расстояния.
block.industrialustry-battery.name = Энергохранилище
block.industrialustry-battery.description = Хранит в себе энергию.
block.industrialustry-sulfur-melter.name = Плавилка серы
block.industrialustry-sulfur-melter.description = Сжигает серу для выработки энергии.
