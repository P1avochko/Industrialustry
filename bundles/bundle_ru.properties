block.industrialustry-assault-constructor.description = Создает юнитов «Заряд». Произведенные юниты могут использоваться напрямую или перемещаться в рефабрикаторы для улучшения.
block.industrialustry-specialist-constructor.name = Конструктор специалистов
block.industrialustry-specialist-constructor.description = Создает юнитов «Вектор». Произведенные юниты могут использоваться напрямую или перемещаться в рефабрикаторы для улучшения.
