#Информация о моде/about mod
mod.industrialustry.name = Индустриалустри
mod.industrialustry.description = Industrialustry — это мод, созданный с нуля автором, который до начала работы не имел опыта ни в программировании, ни в рисовании. На данный момент мод добавляет: \n- 32 блока; \n- три класса юнитов 1-го уровня (Tier 1); \n- 4 «используемых» предмета; \n- 1 вид газа; \n- 3 сектора. \nМод находится на стадии альфа-тестирования, а его создатель активно совершенствует свои навыки в программировании и создании спрайтов; в результате игровой процесс, пусть пока и ограниченный, всё равно доставляет удовольствие.
#Компания и задания на секторах/task or text on sectors
#first-station
first-station.copper = [#975517]Медь[] — один из самых важных ресурсов на этой планете, \nиз неё построено большинство построек (да, это может звучать нелогично, но таковы реалии). \nДобывайте её, чтобы продолжить своё технологическое развитие.
first-station.aluminium = Что ж, раз вы уже изучили бур и транспортную трубу, \nвы теперь можете добывать второй важнейший ресурс на этой планете: [#A9ACB6]алюминий[]. \nОн используется для создания более «высокотехнологичных» предметов, таких как турели.
first-station.turrets = Перейдём к [accent]обороне[]. \nМы далеко не первые, кто высадился на этой планете, \nпоэтому наши враги с Серпуло снова пытаются отнять её у нас и отправляют сюда свои силы. \nТак как вы изучили турели, разместите по одной на каждой из отмеченных клеток и заправьте их медью или алюминием.
first-station.walls = Чтобы наша оборона не развалилась в первые же десять секунд волны, \nпоставьте несколько стен по обе стороны, чтобы защитить наши турели от вражеского огня.
first-station.havefun = С этого момента вы идёте по своему собственному пути в [accent]Industrialustry mod[]. \nЖелаю вам приятного и отличного игрового процесса. \n[accent]Удачи![]
#sphalerite-ridges
sphalerite-ridges.sphalerite = Этот сектор содержит залежи [#c48d42]сфалерита[], \nкоторый используется для производства [#849db7]цинка[]. \nДобывайте его, чтобы открыть возможность исследовать [accent]синтезатор цинка[].
sphalerite-ridges.zinc = [#849db7]Цинк[] — не самый прочный материал, но он достаточно хорошо проводит электричество. \nОн используется в электротехнике и в [accent]производстве юнитов[].
#frontier-garrison
frontier-garrison.brass = [#d4a33b]Латунь[] является основным материалом для создания юнитов.
#Планеты/planets
planet.industrialustry-octanium.name = Октаниум
#Сектора/sectors
sector.industrialustry-first-station.name = Первая станция
sector.industrialustry-first-station.description = Вы были отправлены для исследования новой планеты под названием «Octanium». Вы высадитесь у входа в пещеру — будьте осторожны, так как враг уже выследил ваше местоположение и направил туда свои силы.
sector.industrialustry-sphalerite-ridges.name = Сфалеритовые хребты
sector.industrialustry-sphalerite-ridges.description = Этот сектор содержит многочисленные залежи различных ресурсов, поэтому было бы глупо полагать, что враг оставит нас в покое; \nони сделают всё возможное, чтобы отнять у нас этот сектор. \nИсследуйте цинк, чтобы открыть новые технологии в древе турелей и отразить вражеское наступление. \n\n[accent]Этот сектор может стать довольно резким скачком сложности — приношу свои извинения за это.
sector.industrialustry-frontier-horizon.name = Пограничный горизонт
sector.industrialustry-frontier-horizon.description = В этом секторе расположена вражеская база, \nно она защищена не очень хорошо, \nвам нужно будет производить [#d4a33b]латунь[] и юнитов под названием [accent]«Заряд»[].
#Ресурсы-предметы/items
item.industrialustry-icopper.name = Медь
item.industrialustry-icopper.description = Базовый металл, используемый в основном строительстве, проводке и боеприпасах.
item.industrialustry-aluminium.name = Алюминий
item.industrialustry-aluminium.description = Лёгкий и прочный металл, используемый в продвинутой авиации, каркасных конструкциях и скоростной логистике.
item.industrialustry-sphalerite.name = Сфалерит
item.industrialustry-sphalerite.description = Цинкосодержащая руда. Перерабатывается для извлечения цинка, используемого в производстве сплавов.
item.industrialustry-zinc.name = Цинк
item.industrialustry-zinc.description = Очищенный металл, извлекаемый из сфалерита. Используется в основном в производстве сплавов, таких как латунь.
item.industrialustry-brass.name = Латунь
item.industrialustry-brass.description = Универсальный и прочный сплав меди и цинка. Используется в продвинутой механике, специализированных постройках и вооружении.
item.industrialustry-iron.name = Железо
item.industrialustry-iron.description = Стандартный конструкционный металл. Широко используется в строительстве, машиностроении и базовом производстве.
item.industrialustry-sulfur.name = Сера
item.industrialustry-sulfur.description = Альтернативная версия угля.
#Жидкость/liquids
liquid.industrialustry-natural-gas.name = Природный газ
liquid.industrialustry-natural-gas.description = Быстро испаряющийся газ, добываемый из подземных жерл. Используется в качестве топлива и химического сырья.
#Распределение/distribution
block.industrialustry-copper-transport-pipe.name = Медная транспортная труба
block.industrialustry-copper-transport-pipe.description = Перемещает предметы вперед.
block.industrialustry-smart-transport-pipe.name = Умная транспортная труба
block.industrialustry-smart-transport-pipe.description = Перемещает предметы вперед и не принимает предметы с боков, если они поступают не из присоединенных к ней транспортных труб.
block.industrialustry-copper-bridge.name = Медный мост
block.industrialustry-copper-bridge.description = Перемещает предметы из точки входа в точку подключения моста. Имеет 3 возможных выхода.
block.industrialustry-copper-junction.name = Медный перекрёсток
block.industrialustry-copper-junction.description = Позволяет двум транспортным линиям пересекаться в одной точке.
block.industrialustry-slow-router.name = Медленный маршрутизатор
block.industrialustry-slow-router.description = Имеет один вход и три выхода, равномерно распределяя все поступающие предметы.
block.industrialustry-simple-sorter.name = Простой сортировщик
block.industrialustry-simple-sorter.description = Пропускает только выбранный предмет, в то время как все остальные распределяются по бокам от входа.
block.industrialustry-overflow.name = Медный избыточный затвор
block.industrialustry-overflow.description = Пропускает предметы вперед; если путь заблокирован или заполнен, распределяет их по бокам.
block.industrialustry-inverted-overflow.name = Умный ибыточный затвор
block.industrialustry-inverted-overflow.description = Распределяет предметы по бокам; если оба пути заблокированы или заполнены, пропускает предметы вперед.
#Жидкосное распределение/liquid distribution
block.industrialustry-tube.name = Жидкостная труба
block.industrialustry-tube.description = Транспортирует жидкости вперед.
block.industrialustry-liquid-junction.name = Жидкостый перекрёсток
block.industrialustry-liquid-junction.description = Позволяет двум жидкостным линиям пересекаться в одной точке.
block.industrialustry-liquid-router.name = Жидкостный маршрутизатор
block.industrialustry-liquid-router.description = Имеет один вход и три выхода, равномерно распределяя все поступающие жидкости.
block.industrialustry-liquid-bridge.name = Жидкостный мост
block.industrialustry-liquid-bridge.description = Перемещает жидкости из точки входа в точку подключения моста. Имеет 3 возможных выхода.
block.industrialustry-small-pump.name = Малый насос
block.industrialustry-small-pump.description = Перекачивает жидкость, на которой установлен.
#Буры/drills
block.industrialustry-copper-drill.name = Медный бур
block.industrialustry-copper-drill.description = Медленно добывает рудные блоки под собой.
block.industrialustry-gas-tower.name = Газовая вышка
block.industrialustry-gas-tower.description = При подключении к специальному жерлу (из которого идет синий пар) и к источнику питания начинает откачивать природный газ.
