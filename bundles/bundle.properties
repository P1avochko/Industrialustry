#Информация о моде/about mod
mod.industrialustry.name = Industrialustry 
mod.industrialustry.description = Industrialustry is a mod created from scratch, without any prior knowledge of coding or drawing. As of now, the mod adds: \n- 32 blocks; \n- three classes of Tier 1 units; \n- 4 "usable" items; \n- 1 gas; \n- 3 sectors. \n[accent])The mod is currently in an alpha stage, and the creator is actively honing their coding and spriting skills; as a result, the gameplay — while limited — is nonetheless enjoyable.
#Компания и задания на секторах/task or text on sectors
#first-station
first-station.copper = [#975517]Copper[]] is one of the most important resources on this planet, \nmost structures are built from it (yes, that might sound illogical, but that’s just how it is). \nMine it to continue your technological development.
first-station.aluminium = Well, since you’ve already researched drill and transport pipe, \nyou can now extract the second crucial resource on this planet: [#A9ACB6]aluminum[]. \nIt’s used to craft more "high-tech" items, such as turrets.
first-station.turrets = Let’s move on to [accent]defense[]. \nWe were far from the first to land on this planet, \nso our enemies from Serpuolo are once again trying to take it from us and are sending their forces here. \nSince you have researched turrets, place one on each of the marked tiles and fill them using copper or aluminum.
first-station.walls = And, to ensure our defenses don’t fall apart within the first ten seconds of a wave, \nplace a few walls on either side to shield our turrets from enemy fire.
first-station.havefun = And so, from here on, you follow your own path of the [accent]Industrialustry mod[]. \nI wish you an enjoyable and great gameplay experience. \n[accent]Good Luck[]
#sphalerite-ridges
sphalerite-ridges.sphalerite = This sector contains deposits of [#c48d42]sphalerite[], \nwhich is used in the production of [#849db7]Zinc[]. \nExtract it to unlock the ability to research the [accent]zinc synthesizer[].
sphalerite-ridges.zinc = [#849db7]Zinc[] is not a very strong material, but it is quite good at conducting electricity. \nIt is used in electrical applications and in the [accent]unit construction[].
#frontier-garrison
frontier-garrison.brass = [#d4a33b]Brass[] is the primary material for creating units.
#Планеты/planets
planet.industrialustry-octanium.name = Octanium
#Сектора/sectors
sector.industrialustry-first-station.name = First station
sector.industrialustry-first-station.description = You have been sent to explore the new planet names «Octanium». You will land at the entrance to a cave — be careful, as the enemy has already tracked your location and dispatched their forces there.
sector.industrialustry-sphalerite-ridges.name = Sphalerite ridges
sector.industrialustry-sphalerite-ridges.description = This sector contains numerous deposits of various resources, so it would be foolish to assume the enemy will leave us alone; \nthey will do everything in their power to seize this sector from us. \nResearch zinc to unlock new technologies in the turret tree and repel the enemy offensive. \n\n[accent]This sector might represent a rather sharp spike in difficulty — my apologies for that.
sector.industrialustry-frontier-horizon.name = Frontier horizon
sector.industrialustry-frontier-horizon.description = There is an enemy base in this sector, \nbut it isn’t very well defended, \nyou will need to produce [#d4a33b]brass[] and units called [accent]«Charge»[].
#Ресурсы-предметы/items
item.industrialustry-icopper.name = Copper
item.industrialustry-icopper.description = A fundamental metal used in basic construction, wiring, and ammunition.
item.industrialustry-aluminium.name = Aluminum
item.industrialustry-aluminium.description = A lightweight and durable metal used in advanced aviation, structural framing, and high-speed logistics.
item.industrialustry-sphalerite.name = Sphalerite
item.industrialustry-sphalerite.description = A zinc-bearing mineral ore. Processed to extract zinc for alloy production.
item.industrialustry-zinc.name = Zinc
item.industrialustry-zinc.description = A refined metal extracted from sphalerite. Used primarily in alloy production like brass.
item.industrialustry-brass.name = Brass
item.industrialustry-brass.description = A versatile and durable alloy made from copper and zinc. Used in advanced mechanics, specialized structures, and weaponry.
item.industrialustry-iron.name = Iron
item.industrialustry-iron.description = A standard structural metal. Widely used in construction, machinery, and foundational manufacturing.
item.industrialustry-sulfur.name = Sulfur
item.industrialustry-sulfur.description = Alternative version of coal.
#Жидкость/liquids
liquid.industrialustry-natural-gas.name = Natural gas
liquid.industrialustry-natural-gas.description = A volatile gas extracted from underground vents. Used as fuel and chemical feedstock.
#Распределение/distribution
block.industrialustry-copper-transport-pipe.name = Copper transport pipe
block.industrialustry-copper-transport-pipe.description = Moves items forward.
block.industrialustry-smart-transport-pipe.name = Smart transport pipe
block.industrialustry-smart-transport-pipe.description = Moves items forward does not accept items from the sides unless they come from connected transport pipes.
block.industrialustry-copper-bridge.name = Copper bridge
block.industrialustry-copper-bridge.description = Moves items from the point where they enter to the point where the bridge is connected. Has 3 possible exits.
block.industrialustry-copper-junction.name = Copper junction
block.industrialustry-copper-junction.description = Allows two transport lines to intersect at a single point.
block.industrialustry-slow-router.name = Slow router&
block.industrialustry-slow-router.description = Has one input and three outputs, and evenly distributes all incoming items.
block.industrialustry-simple-sorter.name = Simple sorter
block.industrialustry-simple-sorter.description = Lets only the selected item through, while all the others are distributed to the sides of the entrance.
block.industrialustry-overflow.name = Copper overflow
block.industrialustry-overflow.description = Lets items pass forward; if the path is blocked, distributes them to the sides.
block.industrialustry-inverted-overflow.name = Smart overflow
block.industrialustry-inverted-overflow.description = Distributes items to the sides; if both paths are blocked or full, lets items pass through to the front.
